# Render Blueprint: Dashboard → New → Blueprint → this repository.
# One free web service (512 MB, sleeps after 15 minutes without visitors). Postgres and
# Redis live on free external plans that need no credit card: Neon and Redis Cloud.
# Step by step: docs/deploy-render-free.md
services:
  - type: web
    name: omniio
    runtime: docker
    plan: free
    region: ohio # next to Neon's us-east-2; keep the app in the same region as your database
    dockerfilePath: ./deploy/render.Dockerfile
    dockerContext: .
    healthCheckPath: /health/live
    envVars:
      # Asked for when you create the Blueprint:
      - key: DATABASE_MIGRATOR_URL # Neon: the direct (not -pooler) connection string
        sync: false
      - key: REDIS_URL # Redis Cloud: redis://default:<password>@<host>:<port>
        sync: false
      - key: GEMINI_API_KEY # optional; leave empty for offline demo answers
        sync: false
      # Generated by Render:
      - key: APP_DB_PASSWORD
        generateValue: true
      - key: JWT_SECRET
        generateValue: true
      # Settings:
      - key: COOKIE_SECURE
        value: "true"
      - key: TRUST_PROXY
        value: "3" # proxy hops in front of the app on Render; per-IP rate limits depend on it
      - key: ALLOW_SIGNUP
        value: "true" # set to false after creating your account
