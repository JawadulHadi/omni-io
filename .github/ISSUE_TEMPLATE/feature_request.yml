name: Feature request
description: Suggest an improvement to Omni.io.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: Describe the situation, not the solution.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
  - type: textarea
    id: failure-modes
    attributes:
      label: How should it fail?
      description: Omni.io degrades instead of erroring. What should happen when this feature's dependencies are down?
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
