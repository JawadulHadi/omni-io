name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend · typecheck, unit tests, RLS integration
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: omniio
          POSTGRES_PASSWORD: omniio
          POSTGRES_DB: omniio
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U omniio -d omniio"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    env:
      DATABASE_MIGRATOR_URL: postgres://omniio:omniio@localhost:5432/omniio
      TEST_DATABASE_URL: postgres://omniio_app:omniio_app@localhost:5432/omniio
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - name: Unit tests
        run: npm test -- --ci
      - run: npm run build
      - name: Create the app role (docker/initdb does this locally)
        run: psql "$DATABASE_MIGRATOR_URL" -v ON_ERROR_STOP=1 -f docker/initdb/01-app-role.sql
      - name: Apply migrations as the schema owner
        run: npm run migrate
      - name: Row-level security integration tests (as omniio_app)
        run: npm run test:e2e -- --ci

  frontend:
    name: Frontend · typecheck, console and widget bundles
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
      - name: Widget bundle is ASCII-only
        run: "! grep -qP '[^\\x00-\\x7F]' dist/widget.js"

  images:
    name: Production images build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Backend image (API, worker, migrations)
        run: docker build -f deploy/api.Dockerfile -t omniio-api:ci .
      - name: Web image (console + Caddy)
        run: docker build -f deploy/web.Dockerfile -t omniio-web:ci .
      - name: Compose file is valid
        working-directory: deploy
        run: |
          printf 'DOMAIN=ci.example.com\nPOSTGRES_PASSWORD=x\nAPP_DB_PASSWORD=y\nJWT_SECRET=%s\n' "$(openssl rand -base64 48)" > .env
          docker compose config --quiet
