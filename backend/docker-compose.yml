services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: omniio        # owner/migrator (superuser in dev) — the app does NOT use this role
      POSTGRES_PASSWORD: omniio
      POSTGRES_DB: omniio
    ports: ["5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U omniio -d omniio"]
      interval: 2s
      timeout: 3s
      retries: 30
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
volumes:
  pgdata:
